# Example minimal Hyprland configuration for greetd + neogreet
# /etc/greetd/hyprland.conf

cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = pl
    follow_mouse = 1
}

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

windowrule = match:class ^(apps\.neoth\.neogreet|neogreet)$, fullscreen on

# Optional background for displays without the greeter window:
# exec-once = swaybg -i /usr/share/backgrounds/greeter.png -m fill
exec-once = neogreet; hyprctl dispatch exit
