# Optional neogreet configuration (INI, not greetd TOML).
# Copy to /etc/greetd/neogreet.conf; all files must be readable by greeter.
[appearance]
# Missing/empty wallpaper gives a solid Catppuccin background.
wallpaper = /usr/share/backgrounds/greeter.png
clock_format = %A, %d %B %H:%M
# Optional CSS loaded after the built-in theme. Use a trusted, local file.
css =

[authentication]
# Show username and password together. Use false for passwordless authentication
# or PAM conversations that should ask every question interactively.
password_first = true
